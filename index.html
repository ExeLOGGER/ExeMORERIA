<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Exe Obfuscator Pro</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg: #0a0506;
      --panel: #140b0d;
      --border: #2a1417;
      --border-focus: #4a1f24;
      --accent: #ff3344;
      --accent-dim: #cc2936;
      --text: #f5f0f1;
      --text-dim: #8c7a7c;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* Contenedor Arrastrable */
    .window {
      position: absolute;
      top: 50px;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 540px;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
      z-index: 10;
    }

    .header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      cursor: move;
      display: flex;
      justify-content: space-between;
      align-items: center;
      user-select: none;
    }

    .logo {
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.5px;
      color: var(--text);
    }

    .logo span {
      color: var(--accent);
    }

    .version {
      font-size: 11px;
      color: var(--text-dim);
      background: var(--border);
      padding: 2px 8px;
      border-radius: 4px;
    }

    .content-body {
      padding: 20px;
    }

    /* Sistema de Pestañas */
    .tabs {
      display: flex;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 4px;
      margin-bottom: 20px;
    }

    .tab {
      flex: 1;
      padding: 8px;
      text-align: center;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      color: var(--text-dim);
    }

    .tab-title {
      font-size: 13px;
      font-weight: 500;
      display: block;
    }

    .tab-sub {
      font-size: 9px;
      opacity: 0.7;
      display: block;
    }

    .tab.active {
      background: var(--panel);
      color: var(--accent);
      border: 1px solid var(--border);
    }

    .panel { display: none; }
    .panel.active { display: block; }

    /* Inputs y Controles */
    .field-group {
      margin-bottom: 16px;
    }

    .label-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
    }

    .label-main {
      font-size: 12px;
      color: var(--text);
      display: block;
    }

    .label-sub {
      font-size: 9px;
      color: var(--text-dim);
      display: block;
    }

    .file-label {
      text-align: right;
      cursor: pointer;
      transition: color 0.2s;
    }

    .file-main {
      font-size: 12px;
      color: var(--accent);
      display: block;
    }

    .file-sub {
      font-size: 9px;
      color: var(--text-dim);
      display: block;
    }

    .file-label:hover .file-main {
      color: #ff5566;
    }

    .file-input {
      display: none;
    }

    textarea, .output-box {
      width: 100%;
      height: 160px;
      background: var(--bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      line-height: 1.5;
      outline: none;
      resize: none;
      transition: border-color 0.2s;
    }

    textarea:focus {
      border-color: var(--border-focus);
    }

    .output-box {
      height: 160px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* Diseño alineado (Ofuscar y Limpiar lado a lado) */
    .btn-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .action-group {
      display: grid;
      grid-template-columns: 3fr 1fr;
      gap: 10px;
      margin-bottom: 10px;
    }

    button {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      background: transparent;
      color: var(--text);
    }

    button:hover {
      background: var(--border);
      border-color: var(--border-focus);
    }

    .btn-main {
      font-size: 13px;
      font-weight: 500;
      display: block;
    }

    .btn-sub {
      font-size: 9px;
      color: var(--text-dim);
      display: block;
    }

    button.primary {
      background: var(--accent);
      color: #000;
      border: none;
    }

    button.primary .btn-sub {
      color: #330005;
    }

    button.primary:hover {
      background: #ff5566;
    }

    /* Alerta Lua Superior */
    .lua-warning {
      padding: 12px;
      text-align: center;
      border: 1px dashed var(--accent-dim);
      border-radius: 8px;
      background: rgba(255, 51, 68, 0.04);
      margin-bottom: 16px;
    }

    .warn-main {
      font-size: 12px;
      font-weight: 600;
      color: var(--accent);
      margin-bottom: 2px;
    }

    .warn-sub {
      font-size: 9px;
      color: var(--text-dim);
    }

    .preview-container {
      margin-top: 16px;
      display: none;
    }

    iframe {
      width: 100%;
      height: 100px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: #000;
    }
  </style>
</head>
<body>

  <div class="window" id="dragWindow">
    <div class="header" id="dragHeader">
      <div class="logo">GARAMA <span>OBFUSCATOR PRO</span></div>
      <div class="version">Engine v4</div>
    </div>

    <div class="content-body">
      <div class="tabs">
        <div class="tab active" data-lang="js">
          <span class="tab-title">JavaScript</span>
          <span class="tab-sub">JavaScript</span>
        </div>
        <div class="tab" data-lang="py">
          <span class="tab-title">Python</span>
          <span class="tab-sub">Python</span>
        </div>
        <div class="tab" data-lang="lua">
          <span class="tab-title">Lua</span>
          <span class="tab-sub">Lua</span>
        </div>
      </div>

      <div class="panel active" id="jsPanel">
        <div class="field-group">
          <div class="label-row">
            <div class="label">
              <span class="label-main">JavaScript Code</span>
              <span class="label-sub">Código JavaScript</span>
            </div>
            <label class="file-label">
              <span class="file-main">Load file...</span>
              <span class="file-sub">Cargar archivo...</span>
              <input type="file" class="file-input" accept=".js" onchange="loadFile(this, 'jsInput')">
            </label>
          </div>
          <textarea id="jsInput" placeholder="Paste your JavaScript code here... / Pega tu código aquí..."></textarea>
        </div>
        <div class="action-group">
          <button class="primary" onclick="obfJS()">
            <span class="btn-main">Obfuscate Code</span>
            <span class="btn-sub">Ofuscar Código</span>
          </button>
          <button onclick="clearInput('jsInput')">
            <span class="btn-main">Clear</span>
            <span class="btn-sub">Limpiar</span>
          </button>
        </div>
      </div>

      <div class="panel" id="pyPanel">
        <div class="field-group">
          <div class="label-row">
            <div class="label">
              <span class="label-main">Python Code</span>
              <span class="label-sub">Código Python</span>
            </div>
            <label class="file-label">
              <span class="file-main">Load file...</span>
              <span class="file-sub">Cargar archivo...</span>
              <input type="file" class="file-input" accept=".py" onchange="loadFile(this, 'pyInput')">
            </label>
          </div>
          <textarea id="pyInput" placeholder="Paste your Python code here... / Pega tu código aquí..."></textarea>
        </div>
        <div class="action-group">
          <button class="primary" onclick="obfPY()">
            <span class="btn-main">Obfuscate Code</span>
            <span class="btn-sub">Ofuscar Código</span>
          </button>
          <button onclick="clearInput('pyInput')">
            <span class="btn-main">Clear</span>
            <span class="btn-sub">Limpiar</span>
          </button>
        </div>
      </div>

      <div class="panel" id="luaPanel">
        <div class="lua-warning">
          <div class="warn-main">MODULE UNDER UPDATE / CURRENT BUGS</div>
          <div class="warn-sub">Módulo actualizando / Hay fallos de momento</div>
        </div>
        <div class="field-group">
          <div class="label-row">
            <div class="label">
              <span class="label-main">Lua Code</span>
              <span class="label-sub">Código Lua</span>
            </div>
            <label class="file-label">
              <span class="file-main">Load file...</span>
              <span class="file-sub">Cargar archivo...</span>
              <input type="file" class="file-input" accept=".lua" onchange="loadFile(this, 'luaInput')">
            </label>
          </div>
          <textarea id="luaInput" placeholder="Paste your Lua code here... / Pega tu código aquí..."></textarea>
        </div>
        <div class="action-group">
          <button class="primary" onclick="obfLUA()">
            <span class="btn-main">Obfuscate Code</span>
            <span class="btn-sub">Ofuscar Código</span>
          </button>
          <button onclick="clearInput('luaInput')">
            <span class="btn-main">Clear</span>
            <span class="btn-sub">Limpiar</span>
          </button>
        </div>
      </div>

      <div id="outputSection" style="margin-top: 20px; display: none;">
        <div class="field-group">
          <div class="label-row">
            <div class="label">
              <span class="label-main">Obfuscated Result</span>
              <span class="label-sub">Resultado Ofuscado</span>
            </div>
          </div>
          <div class="output-box" id="outCode"></div>
        </div>
        
        <div class="btn-group">
          <button onclick="copyOut()">
            <span class="btn-main">Copy Result</span>
            <span class="btn-sub">Copiar Resultado</span>
          </button>
          <button onclick="downloadOut()">
            <span class="btn-main">Download</span>
            <span class="btn-sub">Descargar</span>
          </button>
          <button id="runBtn" style="grid-column: span 2; display: none;" onclick="runPreview()">
            <span class="btn-main">Run Preview</span>
            <span class="btn-sub">Ejecutar Vista Previa</span>
          </button>
        </div>

        <div class="preview-container" id="previewWrapper">
          <div class="label-main" style="margin-bottom: 6px; font-size: 12px;">Execution Console / Consola</div>
          <div id="previewArea"></div>
        </div>
      </div>

    </div>
  </div>

  <script>
    // Configuración del Arrastre de Ventana
    const win = document.getElementById('dragWindow');
    const header = document.getElementById('dragHeader');
    let isDragging = false;
    let currentX, currentY, initialX, initialY;
    let xOffset = 0, yOffset = 0;

    header.addEventListener('mousedown', dragStart);
    document.addEventListener('mousemove', drag);
    document.addEventListener('mouseup', dragEnd);
    header.addEventListener('touchstart', dragStart);
    document.addEventListener('touchmove', drag);
    document.addEventListener('touchend', dragEnd);

    function dragStart(e) {
      let clientX = e.type === "touchstart" ? e.touches[0].clientX : e.clientX;
      let clientY = e.type === "touchstart" ? e.touches[0].clientY : e.clientY;
      initialX = clientX - xOffset;
      initialY = clientY - yOffset;
      if (e.target === header || header.contains(e.target)) isDragging = true;
    }

    function drag(e) {
      if (!isDragging) return;
      e.preventDefault();
      let clientX = e.type === "touchmove" ? e.touches[0].clientX : e.clientX;
      let clientY = e.type === "touchmove" ? e.touches[0].clientY : e.clientY;
      currentX = clientX - initialX;
      currentY = clientY - initialY;
      xOffset = currentX;
      yOffset = currentY;
      win.style.transform = `translate(calc(-50% + ${currentX}px), ${currentY}px)`;
    }

    function dragEnd() { isDragging = false; }

    // Control de Pestañas
    const tabs = document.querySelectorAll('.tab');
    const panels = document.querySelectorAll('.panel');

    tabs.forEach(tab => {
      tab.onclick = () => {
        tabs.forEach(t => t.classList.remove('active'));
        panels.forEach(p => p.classList.remove('active'));
        tab.classList.add('active');
        document.getElementById(`${tab.dataset.lang}Panel`).classList.add('active');
        document.getElementById('outputSection').style.display = 'none';
        document.getElementById('previewWrapper').style.display = 'none';
      }
    });

    // Cargar archivos locales
    function loadFile(input, targetId) {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById(targetId).value = e.target.result;
      };
      reader.readAsText(file);
      input.value = '';
    }

    // Botón de limpieza
    function clearInput(targetId) {
      document.getElementById(targetId).value = '';
      document.getElementById('outputSection').style.display = 'none';
      document.getElementById('previewWrapper').style.display = 'none';
    }

    // Codificación Base64
    function b64(str) { return btoa(unescape(encodeURIComponent(str))); }
    let currentExt = 'txt';

    function obfJS() {
      const code = document.getElementById('jsInput').value.trim();
      if (!code) return;
      const out = `(()=>{eval(decodeURIComponent(escape(atob('${b64(code)}'))))})();`;
      showOutput(out, 'js');
    }

    function obfPY() {
      const code = document.getElementById('pyInput').value.trim();
      if (!code) return;
      const out = `import base64\nexec(base64.b64decode('${b64(code)}').decode())`;
      showOutput(out, 'py');
    }

    function obfLUA() {
      const code = document.getElementById('luaInput').value.trim();
      if (!code) return;
      const out = `-- [GARAMA OBFUSCATOR PRO]\n-- MODULE UNDER UPDATE / CURRENT BUGS\n-- Módulo actualizando / Hay fallos de momento\n\nlocal _ = "${b64(code)}"`;
      showOutput(out, 'lua');
    }

    function showOutput(resultText, lang) {
      currentExt = lang;
      document.getElementById('outCode').innerText = resultText;
      document.getElementById('outputSection').style.display = 'block';
      const runBtn = document.getElementById('runBtn');
      if (lang === 'js') {
        runBtn.style.display = 'block';
      } else {
        runBtn.style.display = 'none';
        document.getElementById('previewWrapper').style.display = 'none';
      }
    }

    function copyOut() {
      navigator.clipboard.writeText(document.getElementById('outCode').innerText);
    }

    function downloadOut() {
      const text = document.getElementById('outCode').innerText;
      if (!text) return;
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const link = document.createElement('a');
      link.href = URL.createObjectURL(blob);
      link.download = `obfuscated_${Date.now()}.${currentExt}`;
      link.click();
      URL.revokeObjectURL(link.href);
    }

    function runPreview() {
      const code = document.getElementById('outCode').innerText;
      const wrapper = document.getElementById('previewWrapper');
      const area = document.getElementById('previewArea');
      wrapper.style.display = 'block';
      area.innerHTML = ''; 
      const frame = document.createElement('iframe');
      frame.sandbox = 'allow-scripts';
      frame.srcdoc = `<!doctype html><html><body><script>${code}<\/script></body></html>`;
      area.appendChild(frame);
    }
  </script>
</body>
</html>
